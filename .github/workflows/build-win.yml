name: Build Win Dolphin

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: lol
        run: |
          echo $Python_ROOT_DIR

      - name: Build Dolphin
        run: |
          cmake -Bbuild . -DCMAKE_POLICY_VERSION_MINIMUM="3.5" -DCMAKE_BUILD_TYPE=Release -DPython3_ROOT="%PYTHON_ROOT%" -DPython3_EXECUTABLE="%PYTHON_ROOT%\\python.exe" -DPython3_LIBRARY="%PYTHON_ROOT%\\libs\\python3.lib" -DPython3_INCLUDE_DIR="%PYTHON_ROOT%\\include"
          cmake --build build --config Release -- /m

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: DolphinWin
          path: Binary