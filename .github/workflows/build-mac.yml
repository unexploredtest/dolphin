name: Build Mac OS Wheel

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Install Qt
        run: |
          brew update
          brew install qt

      - name: Try Building Dolphin
        run: |
          python3 BuildMacOSUniversalBinary.py
        continue-on-error: true

      - name: Try Building Dolphin Again
        run: |
          python3 BuildMacOSUniversalBinary.py
          tar -czf dolphin_mac.tar.gz arm64/Binaries

      - name: Upload Dolphin Mac
        uses: actions/upload-artifact@v4
        with:
          name: DolphinMac
          path: dolphin_mac.tar.gz
